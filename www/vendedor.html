<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Vendedor - Danieladas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/api.js"></script>
<style>
  body {
    background: url("img/fondo.png") center/cover fixed no-repeat;
    font-family: "Poppins", sans-serif;
    padding-bottom: 90px;
  }

  .glass-container {
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(14px);
    border-radius: 25px;
    padding: 25px;
    margin-top: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.12);
  }

  h2 {
    color: #e74282;
    font-weight: 700;
    text-align: center;
    letter-spacing: -1px;
  }

  .order-card {
    background: white;
    border-radius: 18px;
    margin-bottom: 18px;
    overflow: hidden;
    border: 2px solid #ffd3e5;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .order-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 18px rgba(233, 78, 132, 0.15);
  }

  .order-header {
    background: #ffd3e5;
    padding: 12px 18px;
    color: #d53879;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
  }

  .order-body {
    padding: 18px;
  }

  .product-item {
    border-left: 4px solid #ffd3e5;
    padding: 6px 10px;
    margin-bottom: 6px;
    font-size: 0.95rem;
  }

  /* ESTADOS */
  .status-badge {
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .status-pendiente { background: #ffc107; color: #000; }
  .status-preparando { background: #17a2b8; color: #fff; }
  .status-listo { background: #28a745; color: #fff; }
  .status-entregado { background: #6c757d; color: #fff; }

  /* BOTONES */
  .order-actions button {
    margin-right: 6px;
    border-radius: 12px !important;
    padding: 6px 12px;
    font-size: 0.8rem;
  }

  .order-total {
    font-size: 1.2rem;
    font-weight: 700;
    color: #d53879;
    text-align: right;
  }

  /* NAVBAR INFERIOR */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(12px);
    padding: 12px 0;
    display: flex;
    justify-content: space-around;
    border-top-left-radius: 22px;
    border-top-right-radius: 22px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.12);
  }

  .nav-link {
    text-align: center;
    font-size: 0.85rem;
    color: #8d8d8d;
    border: none;
    background: none;
  }
  
  .nav-link.active {
    color: #e74282;
    font-weight: 600;
  }

  .nav-link i {
    font-size: 1.5rem;
    margin-bottom: 2px;
  }
  .fade-in {
  animation: fade .5s ease;
}
@keyframes fade {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}


.item-updated {
  animation: pulse 1s ease;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0px #ff7aa5; }
  50% { box-shadow: 0 0 18px #ff7aa5; }
  100% { box-shadow: 0 0 0px #ff7aa5; }
}

/* Floating Notification */
.floating-notification {
  position: fixed;
  bottom: 90px; /* Above bottom nav */
  right: 20px;
  background: linear-gradient(135deg, #e74282, #ff7aa5);
  color: white;
  padding: 12px 20px;
  border-radius: 50px;
  box-shadow: 0 8px 20px rgba(231, 66, 130, 0.4);
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: 10px;
  animation: slideUp 0.3s ease-out;
  backdrop-filter: blur(5px);
  border: 1px solid rgba(255,255,255,0.2);
}

.floating-notification.d-none {
    display: none !important;
}

.floating-notification strong {
    font-weight: 600;
    font-size: 1rem;
}

@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

</style>

</head>
<body>

  <div class="container">
    <div class="glass-container">
      <h2><i class="fas fa-clipboard-list"></i> Pedidos Activos</h2>
      
      <div class="d-flex justify-content-between mb-3">
        <button class="btn btn-sm btn-primary" onclick="window.location.href='escaneoQR.html'">
            <i class="fas fa-qrcode"></i> Escanear QR
        </button>
        <button class="btn btn-sm btn-outline-secondary" onclick="cargarPedidos()">
            <i class="fas fa-sync-alt"></i> Actualizar
        </button>
      </div>

      <!-- Pestañas de Navegación -->
      <ul class="nav nav-pills mb-3 nav-justified" id="pills-tab" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="pills-activos-tab" data-bs-toggle="pill" data-bs-target="#pills-activos" type="button" role="tab" aria-controls="pills-activos" aria-selected="true">
            <i class="fas fa-clock"></i> Activos
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="pills-entregados-tab" data-bs-toggle="pill" data-bs-target="#pills-entregados" type="button" role="tab" aria-controls="pills-entregados" aria-selected="false">
            <i class="fas fa-check-circle"></i> Entregados
          </button>
        </li>
      </ul>

      <div class="tab-content" id="pills-tabContent">
        <!-- Pedidos Activos -->
        <div class="tab-pane fade show active" id="pills-activos" role="tabpanel" aria-labelledby="pills-activos-tab">
            <div id="listaPedidosActivos">
                <div class="text-center py-5">
                    <div class="spinner-border text-pink" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Pedidos Entregados -->
        <div class="tab-pane fade" id="pills-entregados" role="tabpanel" aria-labelledby="pills-entregados-tab">
            <div id="listaPedidosEntregados">
                <p class="text-center text-muted mt-3">No hay pedidos entregados recientes</p>
            </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating Notification -->
  <div id="floating-notification" class="floating-notification d-none">
    <div class="d-flex align-items-center">
        <i class="fas fa-bell me-2"></i>
        <span id="notif-text">Pedido Seleccionado</span>
    </div>
    <button id="notif-open-btn" class="btn btn-sm btn-light text-pink fw-bold rounded-pill px-3 ms-2">
        Ver <i class="fas fa-eye ms-1"></i>
    </button>
    <button onclick="cerrarNotificacion()" class="btn-close btn-close-white ms-2" aria-label="Close"></button>
  </div>

  <!-- Navbar Inferior -->

  <nav class="bottom-nav justify-content-center">
    <button class="nav-link" onclick="confirmarSalida()">
      <i class="fas fa-sign-out-alt"></i> Salir
    </button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/proteger.js"></script>
  <script src="js/notificaciones.js"></script>
  <script src="js/vendedor.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
        verificarVendedor();
        cargarPedidos();
        inicializarNotificaciones();
    });
  </script>
</body>
</html>
