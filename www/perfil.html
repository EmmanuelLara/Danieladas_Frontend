<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
content="
default-src * 'self' data: blob:;
img-src * data: blob: http: https:;
style-src * 'unsafe-inline';
script-src * 'unsafe-inline' 'self' http: https:;
connect-src * http: https:;
">

  <title>Mi Perfil - Danieladas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="css/nav.css">

  <style>
    body {
      background-image: url("img/fondo.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: "Poppins", sans-serif;
      margin: 0;
      padding-bottom: 60px;
    }

    .perfil-card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 30px;
      width: 350px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      backdrop-filter: blur(6px);
      text-align: center;
      margin: 30px auto 10px;
    }

    .perfil-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ff9fd6;
      margin-bottom: 15px;
    }

    h4 {
      color: #e22b5a;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .user-info p {
      margin: 4px 0;
      font-size: 15px;
      color: #555;
    }

    .btn-pink {
      background-color: #ff9fd6;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 10px 20px;
      font-weight: bold;
      margin-top: 10px;
      transition: 0.3s;
    }

    .btn-pink:hover {
      background-color: #ff7fbd;
      transform: translateY(-2px);
    }

    .pedidos-container {
      background: rgba(255,255,255,0.9);
      border-radius: 15px;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      margin: 10px auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .pedido-card {
      border: 2px dashed #ff9fd6;
      border-radius: 15px;
      padding: 10px 15px;
      margin-bottom: 12px;
      background: white;
    }

    .pedido-header {
      font-weight: bold;
      color: #e22b5a;
    }

    .pedido-detalle {
      font-size: 14px;
      color: #444;
      margin-top: 5px;
    }

    .estado {
      font-weight: 600;
      color: #ff7fbd;
    }

    .estado.entregado {
      color: #28a745;
    }
  </style>
</head>
<body>

  <!-- PERFIL -->
 <!-- PERFIL -->
<div class="perfil-card">
  <img id="fotoPerfil" src="img/usuario.png" alt="Foto de perfil" class="perfil-img">

  <h4 id="nombreUsuario">Cargando...</h4>
  <p class="text-muted" id="username">@...</p>

  <div class="user-info mt-3">
    <p id="correo"><i class="bi bi-envelope-fill text-danger"></i> Cargando...</p>
      <p id="telefono"><i class="bi bi-telephone-fill text-danger"></i> Cargando...</p>

    <p id="registro"><i class="bi bi-calendar-heart text-danger"></i> Cargando...</p>
  </div>

  <button class="btn-pink" onclick="editarPerfil()"><i class="bi bi-pencil-fill"></i> Editar Perfil</button>
  <button class="btn-pink" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</button>
</div>


  <!-- PEDIDOS -->
  <div class="pedidos-container">
    <h5 class="text-center text-danger mb-3"><i class="bi bi-receipt-cutoff"></i> Mis Pedidos</h5>
    <div id="listaPedidos"></div>
  </div>

  <!-- NAVBAR -->
  <nav class="bottom-navbar">
    <button class="nav-link" data-page="inicio" onclick="navigateTo('inicio')">
        <span style="font-size: 1.4rem;">🏠</span>
        <span>Inicio</span>
    </button>
    <button class="nav-link" data-page="productos" onclick="navigateTo('productos')">
        <span style="font-size: 1.4rem;">🍦</span>
        <span>Productos</span>
    </button>
    <button class="nav-link" data-page="carrito" onclick="navigateTo('carrito')">
        <span style="font-size: 1.4rem;">🛒</span>
        <span>Carrito</span>
    </button>
    <button class="nav-link active" data-page="cuenta" onclick="navigateTo('cuenta')">
        <span style="font-size: 1.4rem;">👤</span>
        <span>Cuenta</span>
    </button>
  </nav>
<!-- ORDEN CORRECTO DE SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/proteger.js"></script>
  <script>verificarSesion();</script>
  <script src="js/notificaciones.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pedidosCliente.js"></script>
 
<!-- MODAL EDITAR PERFIL -->
<div class="modal fade" id="modalEditarPerfil" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-pink text-white" style="background-color: #ff9fd6;">
        <h5 class="modal-title fw-bold"><i class="bi bi-pencil-square"></i> Editar Perfil</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formEditarPerfil">
          <div class="mb-3 text-center">
            <img id="previewFoto" src="img/usuario.png" class="perfil-img" style="width: 100px; height: 100px;">
            <div class="mt-2">
              <label for="inputFoto" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-camera"></i> Cambiar Foto
              </label>
              <input type="file" id="inputFoto" class="d-none" accept="image/*" onchange="previewImage(event)">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Nombre Completo</label>
            <input type="text" class="form-control" id="inputNombre" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="inputCorreo" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="tel" class="form-control" id="inputTelefono" placeholder="Ej: 5512345678" required>
          </div>


          <div class="mb-3">
            <label class="form-label">Nueva Contraseña <small class="text-muted">(Opcional)</small></label>
            <input type="password" class="form-control" id="inputPass" placeholder="Dejar en blanco para no cambiar">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-pink" onclick="guardarPerfil()">Guardar Cambios</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>



</body>
</html>
