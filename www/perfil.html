<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - Danieladas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/nav.css">

  <style>
    body {
      background-image: url("img/fondo.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: "Poppins", sans-serif;
      margin: 0;
      padding-bottom: 60px;
    }

    .perfil-card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 30px;
      width: 350px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      backdrop-filter: blur(6px);
      text-align: center;
      margin: 30px auto 10px;
    }

    .perfil-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ff9fd6;
      margin-bottom: 15px;
    }

    h4 {
      color: #e22b5a;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .user-info p {
      margin: 4px 0;
      font-size: 15px;
      color: #555;
    }

    .btn-pink {
      background-color: #ff9fd6;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 10px 20px;
      font-weight: bold;
      margin-top: 10px;
      transition: 0.3s;
    }

    .btn-pink:hover {
      background-color: #ff7fbd;
      transform: translateY(-2px);
    }

    .pedidos-container {
      background: rgba(255,255,255,0.9);
      border-radius: 15px;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      margin: 10px auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .pedido-card {
      border: 2px dashed #ff9fd6;
      border-radius: 15px;
      padding: 10px 15px;
      margin-bottom: 12px;
      background: white;
    }

    .pedido-header {
      font-weight: bold;
      color: #e22b5a;
    }

    .pedido-detalle {
      font-size: 14px;
      color: #444;
      margin-top: 5px;
    }

    .estado {
      font-weight: 600;
      color: #ff7fbd;
    }

    .estado.entregado {
      color: #28a745;
    }
  </style>
</head>
<body>

  <!-- PERFIL -->
  <div class="perfil-card">
    <img src="img/usuario.png" alt="Foto de perfil" class="perfil-img">
    <h4 id="nombreUsuario">Cargando...</h4>
    <p class="text-muted" id="username">@...</p>

    <div class="user-info mt-3">
      <p id="correo"><i class="bi bi-envelope-fill text-danger"></i> Cargando...</p>
      <p id="ciudad"><i class="bi bi-geo-alt-fill text-danger"></i> Cargando...</p>
      <p id="registro"><i class="bi bi-calendar-heart text-danger"></i> Cargando...</p>
    </div>

    <button class="btn-pink" onclick="editarPerfil()"><i class="bi bi-pencil-fill"></i> Editar Perfil</button>
    <button class="btn-pink" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</button>
  </div>

  <!-- PEDIDOS -->
  <div class="pedidos-container">
    <h5 class="text-center text-danger mb-3"><i class="bi bi-receipt-cutoff"></i> Mis Pedidos</h5>
    <div id="listaPedidos"></div>
  </div>

  <!-- NAVBAR -->
  <nav class="bottom-navbar">
    <button class="nav-link" data-page="inicio" onclick="navigateTo('inicio')">
        <i class="bi bi-house-door-fill"></i>
        <span>Inicio</span>
    </button>
    <button class="nav-link" data-page="productos" onclick="navigateTo('productos')">
         <i class="bi fa-ice-cream"></i>
        <span>Productos</span>
    </button>
    <button class="nav-link" data-page="carrito" onclick="navigateTo('carrito')">
        <i class="bi bi-cart-fill"></i>
        <span>Carrito</span>
    </button>
    <button class="nav-link active" data-page="cuenta" onclick="navigateTo('cuenta')">
        <i class="bi bi-person-fill"></i>
        <span>Cuenta</span>
    </button>
  </nav>
<!-- ORDEN CORRECTO DE SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/proteger.js"></script>
  <script src="js/main.js"></script>
 

  <script>
    const API = "http://localhost:3000"; // AJUSTA tu URL si usas hosting

    async function cargarPerfil() {
      try {
        const token = localStorage.getItem("token");

        const res = await fetch(`${API}/usuario/perfil`, {
          headers: { "Authorization": `Bearer ${token}` }
        });

        const data = await res.json();

        document.getElementById("nombreUsuario").textContent = data.nombre;
        document.getElementById("username").textContent = "@" + data.usuario;
        document.getElementById("correo").innerHTML = `<i class="bi bi-envelope-fill text-danger"></i> ${data.correo}`;
        document.getElementById("ciudad").innerHTML = `<i class="bi bi-geo-alt-fill text-danger"></i> ${data.ciudad ?? "Sin especificar"}`;
        document.getElementById("registro").innerHTML = `<i class="bi bi-calendar-heart text-danger"></i> Cliente desde: ${data.fechaRegistro?.split("T")[0]}`;
      } 
      catch (err) {
        console.error("Error cargando perfil", err);
      }
    }

    async function cargarPedidos() {
      try {
        const token = localStorage.getItem("token");

        const res = await fetch(`${API}/pedidos/mios`, {
          headers: { "Authorization": `Bearer ${token}` }
        });

        const pedidos = await res.json();
        const cont = document.getElementById("listaPedidos");

        if (pedidos.length === 0) {
          cont.innerHTML = `<p class="text-center text-muted">No tienes pedidos aún 🍧</p>`;
          return;
        }

        pedidos.forEach(p => {
          const productosHTML = p.productos.map(prod => `
            <p>- ${prod.nombre} (${prod.precio} MXN)</p>
          `).join("");

          cont.innerHTML += `
            <div class="pedido-card">
              <div class="pedido-header">Ticket #${p._id}</div>
              <div class="pedido-detalle">
                <p><strong>Fecha:</strong> ${p.fecha.split("T")[0]}</p>
                <p><strong>Total:</strong> $${p.total} MXN</p>
                <p><strong>Estado:</strong> <span class="estado">${p.estado}</span></p>
                <div>${productosHTML}</div>
              </div>
            </div>
          `;
        });

      } catch (err) {
        console.error("Error cargando pedidos", err);
      }
    }

    function cerrarSesion() {
      if (confirm("¿Seguro que deseas cerrar sesión? 🍦")) {
        localStorage.removeItem("usuario");
        localStorage.removeItem("token");
        window.location.href = "login.html";
      }
    }

    cargarPerfil();
    cargarPedidos();
  </script>

</body>
</html>
