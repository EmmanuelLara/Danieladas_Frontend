<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
content="
default-src * 'self' data: blob:;
img-src * data: blob: http: https:;
style-src * 'unsafe-inline';
script-src * 'unsafe-inline' 'self' http: https:;
connect-src * http: https:;
">
  <title>Entregar Pedido - Danieladas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    body {
      background: linear-gradient(135deg, #ff9fd6 0%, #e74282 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
    }
    .entrega-card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      text-align: center;
    }
    .logo {
      width: 100px;
      margin-bottom: 20px;
    }
    .pedido-info {
      background: #f8f9fa;
      border-radius: 15px;
      padding: 20px;
      margin: 20px 0;
      border: 2px dashed #ff9fd6;
    }
    .pedido-info h3 {
      color: #e22b5a;
      margin-bottom: 15px;
    }
    .pedido-info p {
      margin: 8px 0;
      color: #555;
    }
    .btn-entregar {
      background: linear-gradient(135deg, #ff9fd6, #e74282);
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 25px;
      font-size: 1.1rem;
      font-weight: bold;
      width: 100%;
      margin-top: 20px;
      transition: transform 0.3s;
    }
    .btn-entregar:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(231, 66, 130, 0.4);
    }
    .spinner-border {
      width: 3rem;
      height: 3rem;
      border-width: 0.3rem;
    }
  </style>
</head>
<body>
  <div class="entrega-card">
    <img src="img/logo.png" alt="Danieladas" class="logo">
    <h2 style="color: #e22b5a;">Entregar Pedido</h2>
    
    <div id="loading" class="my-4">
      <div class="spinner-border text-danger" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="mt-3 text-muted">Cargando información del pedido...</p>
    </div>

    <div id="pedidoInfo" class="d-none">
      <div class="pedido-info">
        <h3>Ticket #<span id="ticketId"></span></h3>
        <p><strong>Cliente:</strong> <span id="cliente"></span></p>
        <p><strong>Fecha:</strong> <span id="fecha"></span></p>
        <p><strong>Total:</strong> $<span id="total"></span> MXN</p>
        <p><strong>Estado actual:</strong> <span id="estado" class="badge bg-warning"></span></p>
      </div>

      <button class="btn-entregar" onclick="entregarPedido()">
        <i class="bi bi-check-circle-fill"></i> Marcar como Entregado
      </button>
    </div>

    <div id="errorInfo" class="d-none">
      <div class="alert alert-danger">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <p id="errorMsg"></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/proteger.js"></script>
  
  <script>
    let pedidoActual = null;

    document.addEventListener("DOMContentLoaded", async () => {
      // Verificar que el usuario sea vendedor o admin
      verificarSesion();
      
      const usuario = JSON.parse(localStorage.getItem("usuario"));
      const rol = usuario?.rol?.toLowerCase();
      
      if (!rol || !["vendedor", "admin"].includes(rol)) {
        Swal.fire({
          icon: "error",
          title: "Acceso denegado",
          text: "Solo vendedores y administradores pueden entregar pedidos.",
          confirmButtonColor: '#e74282'
        }).then(() => {
          window.location.href = "index.html";
        });
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const pedidoId = params.get("id");

      if (!pedidoId) {
        mostrarError("No se especificó un pedido");
        return;
      }

      await cargarPedido(pedidoId);
    });

    async function cargarPedido(pedidoId) {
      try {
        // Obtener todos los pedidos
        const response = await api.get('/pedidos/todos');
        const pedidos = response.data;
        
        // Buscar el pedido específico
        pedidoActual = pedidos.find(p => p._id === pedidoId);

        if (!pedidoActual) {
          mostrarError("Pedido no encontrado");
          return;
        }

        // Mostrar información del pedido
        document.getElementById("loading").classList.add("d-none");
        document.getElementById("pedidoInfo").classList.remove("d-none");
        
        document.getElementById("ticketId").textContent = pedidoActual.ticketId || pedidoActual._id.slice(-6);
        document.getElementById("cliente").textContent = pedidoActual.usuario?.nombre || "Cliente";
        document.getElementById("fecha").textContent = new Date(pedidoActual.fecha).toLocaleString();
        document.getElementById("total").textContent = Number(pedidoActual.total).toFixed(2);
        
        const estadoBadge = document.getElementById("estado");
        estadoBadge.textContent = pedidoActual.estado;
        
        // Cambiar color del badge según el estado
        estadoBadge.className = "badge ";
        switch(pedidoActual.estado) {
          case "Pendiente":
            estadoBadge.classList.add("bg-warning");
            break;
          case "Preparando":
            estadoBadge.classList.add("bg-info");
            break;
          case "Listo":
            estadoBadge.classList.add("bg-primary");
            break;
          case "Entregado":
            estadoBadge.classList.add("bg-success");
            break;
        }

        // Si ya está entregado, mostrar mensaje
        if (pedidoActual.estado === "Entregado") {
          Swal.fire({
            icon: "info",
            title: "Pedido ya entregado",
            text: "Este pedido ya fue marcado como entregado anteriormente.",
            confirmButtonColor: '#e74282'
          });
        }

      } catch (error) {
        console.error(error);
        mostrarError("Error al cargar el pedido: " + (error.message || "Error desconocido"));
      }
    }

    async function entregarPedido() {
      if (!pedidoActual) return;

      if (pedidoActual.estado === "Entregado") {
        Swal.fire({
          icon: "warning",
          title: "Ya entregado",
          text: "Este pedido ya fue entregado.",
          confirmButtonColor: '#e74282'
        });
        return;
      }

      try {
        // Confirmar la entrega
        const result = await Swal.fire({
          title: '¿Entregar pedido?',
          html: `
            <p>¿Confirmas la entrega del pedido?</p>
            <p class="fw-bold">Ticket #${pedidoActual.ticketId || pedidoActual._id.slice(-6)}</p>
            <p>Cliente: ${pedidoActual.usuario?.nombre || "Cliente"}</p>
          `,
          icon: 'question',
          showCancelButton: true,
          confirmButtonColor: '#28a745',
          cancelButtonColor: '#6c757d',
          confirmButtonText: 'Sí, entregar',
          cancelButtonText: 'Cancelar'
        });

        if (!result.isConfirmed) return;

        // Actualizar estado a "Entregado"
        await api.put(`/pedidos/${pedidoActual._id}/estado`, { estado: "Entregado" });

        // Mostrar éxito y redirigir
        await Swal.fire({
          icon: 'success',
          title: '¡Pedido Entregado!',
          text: 'Redirigiendo...',
          confirmButtonColor: '#e74282',
          timer: 1000,
          showConfirmButton: false
        });

        window.location.href = "vendedor.html";

      } catch (error) {
        console.error(error);
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: 'No se pudo marcar el pedido como entregado: ' + (error.message || "Error desconocido"),
          confirmButtonColor: '#e74282'
        });
      }
    }

    function mostrarError(mensaje) {
      document.getElementById("loading").classList.add("d-none");
      document.getElementById("errorInfo").classList.remove("d-none");
      document.getElementById("errorMsg").textContent = mensaje;
    }
  </script>
</body>
</html>
