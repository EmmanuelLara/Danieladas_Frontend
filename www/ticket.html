<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket de Pedido - Danieladas</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css"
    />
    <style>
.ticket {
  width: 280px;
  padding: 15px;
  border: 1px solid #000;
  font-family: Arial, sans-serif;
  margin: auto;
  background: #fff;
}
.ticket img {
  display: block;
  width: 100px;
  margin: auto;
}
.text-center {
  text-align: center;
}
.line {
  border-bottom: 1px dashed #aaa;
  margin: 8px 0;
}
.total {
  font-size: 18px;
  font-weight: bold;
}
#qr {
  display: flex;
  justify-content: center;
  margin: 10px 0;
}
.btn {
  width: 100%;
  padding: 8px;
  border: none;
  background: #d46a6a;
  color: white;
  cursor: pointer;
  border-radius: 6px;
  font-size: 15px;
}

    </style>
  </head>
  <body>
<div class="ticket" id="ticket">
  <img src="img/logo.png" alt="Danieladas Logo" />
  <h2>Danieladas</h2>
  <p class="text-center">🍦 Nevería Los Sabores</p>
  <p class="text-center">Tel: 123-456-7890</p>
  <div class="line"></div>

  <p><strong>Folio:</strong> <span id="folio"></span></p>
  <p><strong>Cliente:</strong> <span id="cliente"></span></p>
  <p><strong>Fecha:</strong> <span id="fecha"></span></p>

  <div class="line"></div>
  <p><strong>DETALLE DEL PEDIDO</strong></p>
  <div id="detallePedido"></div>

  <div class="line"></div>
  <p class="total">TOTAL: $<span id="total"></span> MXN</p>
  <div class="line"></div>

  <p class="text-center">Escanea tu pedido 📲</p>
  <div id="qr"></div>
  <div class="line"></div>

  <p class="text-center">¡Gracias por tu compra! 💖</p>
  <p class="text-center">Sigue disfrutando de nuestros sabores 😋</p>

  <button class="btn" id="btnGuardar">
    <i class="bi bi-download"></i> Descargar Ticket
  </button>
</div>


    <!-- Librería para generar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script src="js/proteger.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

    <script>
  function cargarTicket(pedido) {
  document.getElementById("folio").textContent = pedido.ticketId;
  document.getElementById("cliente").textContent = pedido.cliente;
  document.getElementById("fecha").textContent =
    new Date(pedido.fecha).toLocaleString();

  const detalle = document.getElementById("detallePedido");
  let html = "";

  pedido.productos.forEach((p) => {
    const cantidad = p.cantidad || 1;
    const subtotal = p.precio * cantidad;

    html += `
      <p><strong>${p.tipo || p.nombre}</strong> ${p.tamano ? `(${p.tamano})` : ""}</p>
      ${p.sabores?.length ? `<p>Sabores: ${p.sabores.join(", ")}</p>` : ""}
      ${p.contenedor ? `<p>Contenedor: ${p.contenedor}</p>` : ""}
      ${p.ingredientes?.length ? `<p>Ingredientes: ${p.ingredientes.join(", ")}</p>` : ""}
      <p>Cantidad: ${cantidad}</p>
      <p>Precio unitario: $${p.precio.toFixed(2)}</p>
      <p><strong>Subtotal: $${subtotal.toFixed(2)}</strong></p>
      <div class="line"></div>
    `;
  });

  detalle.innerHTML = html;
  document.getElementById("total").textContent = pedido.total.toFixed(2);

  // QR genera un link para ver el pedido en tu API
  document.getElementById("qr").innerHTML = "";
  new QRCode(document.getElementById("qr"), {
    text: `https://midominio.com/pedido/${pedido.ticketId}`,
    width: 120,
    height: 120,
  });
}

    </script>
  </body>
</html>
