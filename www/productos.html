<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - Nevería Los Sabores</title>

  <!-- Iconos e interfaz -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Tus estilos -->
  <link rel="stylesheet" href="css/catalogo.css">
  <link rel="stylesheet" href="css/nav.css">

  <style> 
    body {
      background-image: url('/img/fondo.png');
    }
  </style>
</head>

<body>
  <div class="pastel-bg">
    <div class="catalogo-header">
      <h1 class="catalogo-title">Nuestros<br>Productos</h1>
      <p class="catalogo-subtitle">Elige lo que más te guste</p>
    </div>

    <div class="categorias-grid">
      <div class="categoria-card" onclick="selectCategory('Nieves')">
        <img src="img/nieves.png" alt="Nieves">
        <h3>Nieves</h3>
      </div>

      <div class="categoria-card" onclick="selectCategory('Paletas')">
        <img src="img/paletas.png" alt="Paletas">
        <h3>Paletas</h3>
      </div>

      <div class="categoria-card" onclick="selectCategory('Nachos')">
        <img src="img/nachos.png" alt="Nachos">
        <h3>Nachos</h3>
      </div>

      <div class="categoria-card" onclick="selectCategory('Pasteles')">
        <img src="img/pasteles.png" alt="Pasteles">
        <h3>Pasteles</h3>
      </div>
    </div>
  </div>
   <nav class="bottom-navbar">
        <button class="nav-link" onclick="navigateTo('inicio')">
            <i class="bi bi-house-door-fill"></i>
            <span>Inicio</span>
        </button>

        <button class="nav-link" onclick="navigateTo('productos')">
            <i class="fa-solid fa-ice-cream"></i>
            <span>Productos</span>
        </button>

        <button class="nav-link" onclick="navigateTo('carrito')">
            <i class="bi bi-cart-fill"></i>
            <span>Carrito</span>
        </button>

        <button class="nav-link" onclick="navigateTo('cuenta')">
            <i class="bi bi-person-fill"></i>
            <span>Cuenta</span>
        </button>
    </nav>

  <!-- ORDEN CORRECTO DE SCRIPTS -->
   <script src="js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/api.js"></script>
<script src="js/proteger.js"></script>
<script>verificarSesion();</script>

<script src="js/categoria.js"></script>

</body>
</html>
