<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - Danieladas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/api.js"></script>

  <style>
    body {
      background-image: url("img/fondo.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: "Poppins", sans-serif;
      margin: 0;
    }

    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 30px 25px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      width: 320px;
    }

    .logo {
      width: 120px;
      border-radius: 25%;
      margin: 0 auto 15px auto;
    }

    .form-control {
      background-color: rgba(255, 227, 243, 0.9);
      border: none;
      border-radius: 25px;
      margin-bottom: 15px;
      padding: 10px;
      text-align: center;
    }

    .btn {
      background-color: #ff9fd6;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      width: 100%;
      padding: 10px;
      transition: all 0.3s;
      color: white;
      box-shadow: 0 4px 10px rgba(255, 159, 214, 0.5);
    }

    .btn:hover {
      background-color: #ff7fbd;
      transform: translateY(-2px);
    }

    a {
      color: #e22b5a;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }
    body.swal2-shown {
  padding-right: 0 !important;
  overflow-y: hidden !important;
}
.swal2-border-radius {
  border-radius: 20px !important;
}


  </style>
</head>

<body>
  <div class="card">
    <img src="img/logo.png" alt="Danieladas Logo" class="logo" />
    <h5 class="mb-3">Registro de usuario</h5>

    <input type="text" class="form-control" placeholder="Nombre completo" id="nombre" />
    <input type="email" class="form-control" placeholder="Correo electrónico" id="email" />
    <input type="password" class="form-control" placeholder="Contraseña" id="pass" />
    <input type="password" class="form-control" placeholder="Confirmar contraseña" id="confirmar" />

    <button class="btn mt-2" onclick="registrar()">Crear cuenta</button>

    <p class="mt-3">
      ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
    </p>
  </div>

<script>
  function limpiarEstilos() {
  document.getElementById("nombre").style.border = "";
  document.getElementById("email").style.border = "";
  document.getElementById("pass").style.border = "";
  document.getElementById("confirmar").style.border = "";
}

function marcarError(input, mensaje) {
  input.style.border = "2px solid #ff4f8b";

  Swal.fire({
    icon: "warning",
    title: "¡Ups!",
    text: mensaje,
    background: "rgba(255, 255, 255, 0.9)",
    color: "#d63384",
    confirmButtonColor: "#ff7fbd",
    confirmButtonText: "Entendido",
    customClass: {
      popup: "swal2-border-radius"
    }
  });
}

async function registrar() {
  limpiarEstilos();

  const nombre = document.getElementById("nombre").value.trim();
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("pass").value.trim();
  const confirmar = document.getElementById("confirmar").value.trim();

  const inputNombre = document.getElementById("nombre");
  const inputEmail = document.getElementById("email");
  const inputPass = document.getElementById("pass");
  const inputConfirmar = document.getElementById("confirmar");

  // VALIDACIONES -----------------------------

  if (!nombre) return marcarError(inputNombre, "Ingresa tu nombre completo.");
  if (nombre.length < 3) return marcarError(inputNombre, "El nombre es muy corto.");

  const regexCorreo = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!regexCorreo.test(email)) return marcarError(inputEmail, "Ingresa un correo válido.");

  if (pass.length < 6)
    return marcarError(inputPass, "La contraseña debe tener al menos 6 caracteres.");

  if (pass !== confirmar)
    return marcarError(inputConfirmar, "Las contraseñas no coinciden.");

  localStorage.removeItem("token");

  // PETICIÓN -----------------------------

  try {
    // 1. REGISTRO
    await api.post("/registro", {
      nombre,
      email,
      pass
    });

    // 2. LOGIN AUTOMÁTICO
    const loginRes = await api.post("/login", { email, pass });
    
    // Guardar sesión
    localStorage.setItem("token", loginRes.data.token);
    localStorage.setItem("usuario", JSON.stringify(loginRes.data.usuario));

    Swal.fire({
      icon: "success",
      title: "¡Bienvenido!",
      text: "Tu cuenta ha sido creada con éxito 🍧",
      background: "rgba(255, 255, 255, 0.9)",
      color: "#d63384",
      timer: 1500,
      showConfirmButton: false
    }).then(() => {
      window.location.href = "index.html";
    });

  } catch (err) {
    console.error(err);
    const msg = err.response?.data?.mensaje || "Error al registrar ❌";

    Swal.fire({
      icon: "error",
      title: "Error",
      text: msg,
      background: "rgba(255, 255, 255, 0.9)",
      color: "#d63384",
      confirmButtonColor: "#ff7fbd",
    });

    if (msg.toLowerCase().includes("correo")) inputEmail.style.border = "2px solid red";
    if (msg.toLowerCase().includes("nombre")) inputNombre.style.border = "2px solid red";
    if (msg.toLowerCase().includes("contraseña")) inputPass.style.border = "2px solid red";
  }
}

</script>

</body>
</html>
