<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión - Danieladas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- TU API CONFIGURADA -->
  <script src="js/api.js"></script>
  <script>
    // Hacer API_URL disponible globalmente para mensajes de error
    const API_URL = "http://192.168.1.72:4000";
  </script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      background-image: url("img/fondo.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: "Poppins", sans-serif;
      margin: 0;
      overflow: hidden;
    }

    html.swal2-shown,
    body.swal2-shown {
      overflow: hidden !important;
      height: 100% !important;
      padding-right: 0 !important;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 30px 25px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      width: 330px;
      backdrop-filter: blur(6px);
    }

    .logo {
      width: 130px;
      display: block;
      border-radius: 25%;
      margin: 0 auto 15px auto;
    }

    h5 {
      color: #d94c7c;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .form-control {
      background-color: #ffe3f3;
      border: none;
      border-radius: 25px;
      margin-bottom: 15px;
      padding: 10px;
      text-align: center;
      font-weight: 500;
    }

    .form-control.error {
      border: 2px solid #ff4668 !important;
      background-color: #ffe2e9;
    }

    .btn {
      background-color: #ff9fd6;
      border: none;
      border-radius: 25px;
      color: white;
      font-weight: bold;
      width: 100%;
      padding: 10px;
    }

    .btn:hover {
      background-color: #ff7fbd;
      transform: translateY(-2px);
    }

    a {
      color: #e22b5a;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="img/logo.png" alt="Danieladas Logo" class="logo" />
    <h5>Iniciar sesión</h5>

    <input type="email" class="form-control" placeholder="Correo electrónico" id="email" />
    <input type="password" class="form-control" placeholder="Contraseña" id="pass" />

    <button class="btn mt-2" onclick="iniciarSesion()">Iniciar sesión</button>

    <p class="mt-3">
      ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
    </p>
  </div>

<script>
// =====================================
// SWEET ALERT
// =====================================
function alerta(icon, titulo, mensaje) {
  Swal.fire({
    icon,
    title: titulo,
    html: mensaje,
    confirmButtonColor: "#ff7fbd",
    background: "rgba(255,255,255,0.95)",
    backdrop: "rgba(0,0,0,0.3)"
  });
}

function marcarError(input, mensaje) {
  input.classList.add("error");
  alerta("warning", "Ups...", mensaje);
}

function limpiarEstilos() {
  document.getElementById("email").classList.remove("error");
  document.getElementById("pass").classList.remove("error");
}

// =====================================
// INICIAR SESIÓN
// =====================================
async function iniciarSesion() {
  limpiarEstilos();

  const emailInput = document.getElementById("email");
  const passInput = document.getElementById("pass");

  const email = emailInput.value.trim();
  const pass = passInput.value.trim();

  if (!email) return marcarError(emailInput, "Ingresa tu correo electrónico 🍦");
  if (!pass) return marcarError(passInput, "Escribe tu contraseña 🍨");

  const regexCorreo = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!regexCorreo.test(email)) {
    return marcarError(emailInput, "Ingresa un correo válido.<br><b>usuario@correo.com</b>");
  }

  if (pass.length < 6) {
    return marcarError(passInput, "Tu contraseña debe tener al menos 6 caracteres 🔐");
  }

  try {
    // LLAMADA A TU API
    const r = await api.post("/login", { email, pass });

    // GUARDAR TOKEN Y USUARIO
    localStorage.setItem("token", r.data.token);
    localStorage.setItem("usuario", JSON.stringify(r.data.usuario));

    Swal.fire({
      icon: "success",
      title: "¡Bienvenido! 🩷",
      text: "Accediendo...",
      timer: 1500,
      showConfirmButton: false
    }); 

    setTimeout(() => {
      const rol = r.data.usuario.rol.trim().toLowerCase();
      if (rol === "admin") {
        window.location.href = "admin.html";
      } else if (rol === "vendedor") {
        window.location.href = "vendedor.html";
      } else {
        window.location.href = "index.html";
      }
    }, 1500);

  } catch (err) {
    console.error("❌ Error login completo:", err);
    console.error("❌ Error message:", err.message);
    console.error("❌ Error code:", err.code);
    console.error("❌ Error response:", err.response);
    console.error("❌ Error request:", err.request);

    let msg = "❌ Error al iniciar sesión";
    
    // Prioridad: mensaje del usuario > mensaje del servidor > mensaje genérico
    if (err.userMessage) {
      msg = err.userMessage;
    } else if (err.response?.data?.mensaje) {
      msg = err.response.data.mensaje;
    } else if (err.message === "Network Error" || err.code === "ECONNABORTED" || err.message?.includes("Network") || err.code === "ERR_NETWORK") {
      msg = `No se pudo conectar al servidor.\n\nVerifica:\n• Tu conexión WiFi está activa\n• El celular está en la misma red WiFi que la PC\n• El servidor está corriendo en ${API_URL}\n• El firewall permite el puerto 4000`;
    } else if (err.message) {
      msg = `Error: ${err.message}`;
    }

    alerta("error", "Error", msg);

    if (msg.includes("correo")) emailInput.classList.add("error");
    if (msg.includes("contraseña")) passInput.classList.add("error");
  }
}
</script>

</body>
</html>
