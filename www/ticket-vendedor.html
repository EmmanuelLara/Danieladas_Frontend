<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalle de Pedido - Vendedor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
      body {
        background: linear-gradient(135deg, #ff9fd6 0%, #e74282 100%);
        min-height: 100vh;
        font-family: 'Poppins', sans-serif;
        padding: 20px 0;
      }
      .pedido-container {
        width: 100%;
        max-width: 500px;
        margin: 0 auto;
        padding: 20px;
      }
      .pedido-card {
        background: white;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      }
      .header-section {
        text-align: center;
        border-bottom: 3px dashed #ff9fd6;
        padding-bottom: 20px;
        margin-bottom: 20px;
      }
      .ticket-id {
        font-size: 2rem;
        font-weight: 800;
        color: #e22b5a;
        margin: 10px 0;
      }
      .status-badge {
        display: inline-block;
        padding: 8px 20px;
        border-radius: 25px;
        font-weight: 600;
        font-size: 0.9rem;
        margin-top: 10px;
      }
      .status-pendiente { background: #ffc107; color: #000; }
      .status-preparando { background: #17a2b8; color: #fff; }
      .status-listo { background: #28a745; color: #fff; }
      .status-entregado { background: #6c757d; color: #fff; }
      
      .info-row {
        display: flex;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid #f0f0f0;
      }
      .info-row:last-child {
        border-bottom: none;
      }
      .info-icon {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, #ff9fd6, #e74282);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1.2rem;
        margin-right: 15px;
        flex-shrink: 0;
      }
      .info-content {
        flex: 1;
      }
      .info-label {
        font-size: 0.75rem;
        color: #999;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .info-value {
        font-size: 1rem;
        color: #333;
        font-weight: 600;
        margin-top: 2px;
      }
      .productos-section {
        background: #f8f9fa;
        border-radius: 15px;
        padding: 20px;
        margin: 20px 0;
      }
      .productos-title {
        font-weight: 700;
        color: #e22b5a;
        margin-bottom: 15px;
        font-size: 1.1rem;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .producto-item {
        background: white;
        border-radius: 12px;
        padding: 15px;
        margin-bottom: 12px;
        border-left: 4px solid #ff9fd6;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      }
      .producto-header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        margin-bottom: 8px;
      }
      .producto-nombre {
        font-weight: 700;
        color: #333;
        font-size: 1rem;
      }
      .producto-precio {
        text-align: right;
      }
      .producto-cantidad {
        color: #666;
        font-size: 0.85rem;
      }
      .producto-subtotal {
        color: #e22b5a;
        font-weight: 700;
        font-size: 1.1rem;
      }
      .producto-detalles {
        font-size: 0.85rem;
        color: #666;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px dashed #e0e0e0;
      }
      .producto-detalles div {
        margin: 4px 0;
      }
      .total-section {
        background: linear-gradient(135deg, #ff9fd6, #e74282);
        border-radius: 15px;
        padding: 20px;
        color: white;
        text-align: center;
        margin: 20px 0;
      }
      .total-label {
        font-size: 0.9rem;
        opacity: 0.9;
        margin-bottom: 5px;
      }
      .total-amount {
        font-size: 2.5rem;
        font-weight: 800;
      }
      .actions-section {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 20px;
      }
      .btn-action {
        padding: 15px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1rem;
        border: none;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .btn-action:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      }
      .btn-preparar {
        background: #ffc107;
        color: #000;
      }
      .btn-listo {
        background: #17a2b8;
        color: white;
      }
      .btn-entregar {
        background: #28a745;
        color: white;
      }
      .btn-volver {
        background: #6c757d;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="pedido-container">
      <div class="pedido-card">
        <!-- Header -->
        <div class="header-section">
          <div>
            <i class="fas fa-receipt" style="font-size: 2.5rem; color: #ff9fd6;"></i>
          </div>
          <div class="ticket-id" id="ticketId">Cargando...</div>
          <div class="status-badge" id="estadoBadge">Pendiente</div>
        </div>

        <!-- Información del Cliente -->
        <div class="info-row">
          <div class="info-icon">
            <i class="fas fa-user"></i>
          </div>
          <div class="info-content">
            <div class="info-label">Cliente</div>
            <div class="info-value" id="clienteNombre">...</div>
          </div>
        </div>

        <div class="info-row">
          <div class="info-icon">
            <i class="far fa-clock"></i>
          </div>
          <div class="info-content">
            <div class="info-label">Fecha y Hora</div>
            <div class="info-value" id="fechaPedido">...</div>
          </div>
        </div>

        <!-- Productos -->
        <div class="productos-section">
          <div class="productos-title">
            <i class="fas fa-ice-cream"></i>
            <span>Productos del Pedido</span>
          </div>
          <div id="listaProductos">
            <p class="text-center text-muted">Cargando productos...</p>
          </div>
        </div>

        <!-- Total -->
        <div class="total-section">
          <div class="total-label">TOTAL A COBRAR</div>
          <div class="total-amount">$<span id="totalPedido">0.00</span></div>
        </div>

        <!-- Acciones -->
        <div class="actions-section" id="accionesPedido">
          <!-- Se llenan dinámicamente -->
        </div>

        <div class="actions-section">
          <button class="btn btn-action btn-volver" onclick="window.location.href='vendedor.html'">
            <i class="fas fa-arrow-left"></i>
            Volver a Pedidos
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/proteger.js"></script>
    
    <script>
      let pedidoActual = null;

      document.addEventListener("DOMContentLoaded", async () => {
        verificarSesion();
        
        const params = new URLSearchParams(window.location.search);
        const pedidoId = params.get("id");

        if (!pedidoId) {
          Swal.fire("Error", "No se especificó un pedido", "error").then(() => {
            window.location.href = 'vendedor.html';
          });
          return;
        }

        await cargarPedido(pedidoId);
      });

      async function cargarPedido(id) {
        try {
          Swal.showLoading();

          // Intentar obtener el pedido
          let pedido = null;
          
          try {
            const res = await api.get(`/pedidos/${id}`);
            pedido = res.data;
          } catch (e) {
            // Fallback: buscar en todos
            const res = await api.get('/pedidos/todos');
            pedido = res.data.find(p => p._id === id);
          }

          if (!pedido) {
            throw new Error("Pedido no encontrado");
          }

          pedidoActual = pedido;
          renderizarPedido(pedido);
          Swal.close();

        } catch (error) {
          console.error(error);
          Swal.fire({
            icon: 'error',
            title: 'Error',
            text: 'No se pudo cargar el pedido',
            confirmButtonColor: '#e74282'
          }).then(() => {
            window.location.href = 'vendedor.html';
          });
        }
      }

      function renderizarPedido(pedido) {
        // Ticket ID
        document.getElementById('ticketId').textContent = `#${pedido.ticketId || pedido._id.slice(-6).toUpperCase()}`;
        
        // Estado
        const estadoBadge = document.getElementById('estadoBadge');
        estadoBadge.textContent = pedido.estado;
        estadoBadge.className = 'status-badge status-' + pedido.estado.toLowerCase();

        // Cliente
        document.getElementById('clienteNombre').textContent = pedido.usuario?.nombre || 'Cliente General';

        // Fecha
        const fecha = new Date(pedido.fecha);
        document.getElementById('fechaPedido').textContent = fecha.toLocaleString('es-MX', {
          day: '2-digit',
          month: 'long',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });

        // Productos
        const listaProductos = document.getElementById('listaProductos');
        let productosHtml = '';

        if (pedido.productos && pedido.productos.length > 0) {
          pedido.productos.forEach(p => {
            const cantidad = p.cantidad || 1;
            const precio = Number(p.precio) || 0;
            const subtotal = precio * cantidad;

            let nombreProducto = p.nombre || p.tipo || 'Producto';
            if (p.tamano) nombreProducto += ` (${p.tamano})`;

            let detallesHtml = '';
            if (p.sabores && p.sabores.length > 0) {
              detallesHtml += `<div><strong>Sabores:</strong> ${p.sabores.join(', ')}</div>`;
            }
            if (p.contenedor) {
              detallesHtml += `<div><strong>Contenedor:</strong> ${p.contenedor}</div>`;
            }
            if (p.ingredientes && p.ingredientes.length > 0) {
              detallesHtml += `<div><strong>Ingredientes:</strong> ${p.ingredientes.join(', ')}</div>`;
            }
            if (p.tipo && !nombreProducto.includes(p.tipo)) {
              detallesHtml += `<div><strong>Tipo:</strong> ${p.tipo}</div>`;
            }

            productosHtml += `
              <div class="producto-item">
                <div class="producto-header">
                  <div>
                    <div class="producto-nombre">${nombreProducto}</div>
                    <div class="producto-cantidad">${cantidad} unidad${cantidad > 1 ? 'es' : ''}</div>
                  </div>
                  <div class="producto-precio">
                    <div class="producto-cantidad">${cantidad} × $${precio.toFixed(2)}</div>
                    <div class="producto-subtotal">$${subtotal.toFixed(2)}</div>
                  </div>
                </div>
                ${detallesHtml ? `<div class="producto-detalles">${detallesHtml}</div>` : ''}
              </div>
            `;
          });
        } else {
          productosHtml = '<p class="text-center text-muted">No hay productos</p>';
        }

        listaProductos.innerHTML = productosHtml;

        // Total
        document.getElementById('totalPedido').textContent = Number(pedido.total || 0).toFixed(2);

        // Acciones según estado
        renderizarAcciones(pedido);
      }

      function renderizarAcciones(pedido) {
        const accionesDiv = document.getElementById('accionesPedido');
        let html = '';

        if (pedido.estado === 'Pendiente') {
          html = `
            <button class="btn btn-action btn-preparar" onclick="cambiarEstado('Preparando')">
              <i class="fas fa-utensils"></i>
              Comenzar a Preparar
            </button>
          `;
        } else if (pedido.estado === 'Preparando') {
          html = `
            <button class="btn btn-action btn-listo" onclick="cambiarEstado('Listo')">
              <i class="fas fa-check"></i>
              Marcar como Listo
            </button>
          `;
        } else if (pedido.estado === 'Listo') {
          html = `
            <button class="btn btn-action btn-entregar" onclick="cambiarEstado('Entregado')">
              <i class="fas fa-check-double"></i>
              Marcar como Entregado
            </button>
          `;
        } else if (pedido.estado === 'Entregado') {
          html = `
            <div class="alert alert-success text-center mb-0">
              <i class="fas fa-check-circle"></i> Este pedido ya fue entregado
            </div>
          `;
        }

        accionesDiv.innerHTML = html;
      }

      async function cambiarEstado(nuevoEstado) {
        if (!pedidoActual) return;

        try {
          Swal.showLoading();

          await api.put(`/pedidos/${pedidoActual._id}/estado`, { estado: nuevoEstado });

          Swal.fire({
            icon: 'success',
            title: `Pedido ${nuevoEstado}`,
            text: 'Estado actualizado correctamente',
            timer: 1500,
            showConfirmButton: false
          });

          // Recargar pedido
          await cargarPedido(pedidoActual._id);

        } catch (error) {
          console.error(error);
          Swal.fire({
            icon: 'error',
            title: 'Error',
            text: 'No se pudo actualizar el estado',
            confirmButtonColor: '#e74282'
          });
        }
      }
    </script>
  </body>
</html>
